<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip과 함께 가족 영어</title>
<meta name="theme-color" content="#FFC83D">
<meta name="description" content="Pip과 함께하는 우리 가족 영어 회화">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pip 영어">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8EC; --card:#FFFFFF; --ink:#2B2A33; --soft:#6B6878; --line:#EFE6D6;
    --sun:#FFC83D; --sun-deep:#F5A300; --leaf:#47B881; --sky:#4A9FE8; --berry:#EE6A7B; --plum:#8E6CD8;
    --radius:22px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;cursor:pointer;border:none}
  .en{font-family:"Fredoka","Jua",system-ui,sans-serif;font-weight:600}
  .ko-title{font-family:"Jua",system-ui,sans-serif}
  #app{max-width:860px;margin:0 auto;padding:18px 16px 60px;min-height:100vh}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .topbar h1{font-family:"Jua";font-size:22px;margin:0;flex:1}
  .back{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-size:15px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:560px){.g2{grid-template-columns:1fr}}
  .btn{border-radius:16px;padding:14px 18px;font-size:17px;font-family:"Jua";display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:var(--sun);color:#3a2a00;box-shadow:0 4px 0 var(--sun-deep)}
  .btn.green{background:var(--leaf);color:#fff;box-shadow:0 4px 0 #2f8d61}
  .btn.blue{background:var(--sky);color:#fff;box-shadow:0 4px 0 #2f7cc0}
  .btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
  .btn.big{font-size:24px;padding:20px 26px;border-radius:22px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .muted{color:var(--soft);font-size:14px}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;background:#F3EEFF;color:var(--plum);font-family:"Jua"}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .center{text-align:center}
  .profile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-radius:var(--radius);background:#fff;border:2px solid var(--line);font-family:"Jua";font-size:19px}
  .profile .face{font-size:52px;line-height:1}
  .profile small{font-family:"Gowun Dodum";color:var(--soft);font-size:13px}
  .family-cta{background:linear-gradient(135deg,#FFD866,#FFB443);border-radius:28px;padding:22px;display:flex;align-items:center;gap:16px;box-shadow:0 6px 0 #E89A1E;color:#3a2a00;width:100%;text-align:left}
  .family-cta h2{margin:0;font-family:"Jua";font-size:26px}
  .family-cta p{margin:4px 0 0;font-size:15px}
  .pip{width:110px;height:110px;flex-shrink:0}
  .pip.bounce{animation:bounce 1.2s ease-in-out infinite}
  .pip.talk .beak{animation:talk .25s ease-in-out infinite alternate}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes talk{from{transform:scaleY(1)}to{transform:scaleY(.55)}}
  .stage-bar{display:flex;gap:6px;margin:6px 0 14px}
  .stage-bar div{flex:1;height:10px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
  .stage-bar div.done{background:var(--leaf)}
  .stage-bar div.now span{position:absolute;inset:0;background:var(--sun);transform-origin:left}
  .stage-title{font-family:"Jua";font-size:24px;margin:0}
  .huge{font-size:120px;line-height:1.1}
  .word{font-size:46px;margin:6px 0}
  .line-big{font-size:30px;line-height:1.35;margin:8px 0}
  .hint{font-size:15px;color:var(--soft)}
  .turn-who{display:inline-flex;align-items:center;gap:8px;font-family:"Jua";font-size:20px;padding:6px 14px;border-radius:999px;background:#EAF6EF;color:#23704a}
  .chant p{font-size:26px;margin:8px 0;padding:6px 12px;border-radius:12px;transition:background .2s}
  .chant p.on{background:#FFF1C2}
  .timer{font-family:"Fredoka";font-size:15px;color:var(--soft)}
  .burst{position:fixed;pointer-events:none;font-size:34px;animation:fly 1.1s ease-out forwards;z-index:50}
  @keyframes fly{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
  .listen-ring{width:90px;height:90px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:40px;background:#FFF1C2;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,.6)}50%{box-shadow:0 0 0 18px rgba(255,200,61,0)}}
  .stars{font-size:34px;letter-spacing:4px}
  .chips{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .chip{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:19px;text-align:left}
  .chip:hover{border-color:var(--sky)}
  .bubble{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 16px;font-size:21px;position:relative}
  .me{background:#EAF3FF;border-color:#CFE2FB;margin-left:40px}
  .chat{display:flex;flex-direction:column;gap:10px}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tabs button{flex:1;padding:12px;border-radius:14px;background:#fff;border:2px solid var(--line);font-family:"Jua";font-size:17px}
  .tabs button.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
  .item.today{border-color:var(--sun)}
  .heard{font-size:15px;color:var(--sky);margin-top:6px;min-height:20px}
  .modal{position:fixed;inset:0;background:rgba(40,30,10,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
  .modal .card{max-width:440px;width:100%}
  input[type=number],input[type=text]{font-size:20px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);width:100%;font-family:inherit}
  label.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-size:15px;line-height:1.5}
  label.check input{width:22px;height:22px;margin-top:2px;flex-shrink:0}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
  .notice{background:#FFF1C2;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
  .lock{font-size:80px}
  .sr{position:absolute;left:-9999px}
  .lvp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 10px;margin-bottom:12px}
  .lvp.compact{display:inline-flex;padding:4px 6px;margin:0;border-radius:12px}
  .lvp-label{font-family:"Jua";font-size:15px;margin-right:4px}
  .lvp-desc{flex-basis:100%;font-size:13px}
  .lvb{font-family:"Fredoka";font-size:14px;padding:6px 10px;border-radius:10px;background:#F4EFE6;color:var(--soft)}
  .lvp.compact .lvb{padding:4px 8px;font-size:13px}
  .lvb.on{background:var(--plum);color:#fff}
</style>
</head>

       ko:["해가 떴어요. Pip이 눈을 떠요.","해가 떴어요. Pip이 눈을 뜨고 웃어요.","해가 언덕 위로 떠오르고, Pip이 졸린 눈을 천천히 떠요.","어느 밝은 아침, 해님이 창문으로 들여다보며 Pip을 깨웠어요.","아침 햇살이 커튼 사이로 스며들어 Pip을 살며시 깨웠어요."]},
      {emoji:"🥱",
       en:["Pip yawns. Yaaawn! \"Good morning, sun!\"","Pip yawns and stretches. \"Good morning, sun!\"","Pip yawns a big yawn and stretches his little wings. \"Good morning, sun!\" he says.","Pip let out a huge yawn and stretched his wings as wide as he could. \"Good morning, sun!\" he chirped.","Pip let out an enormous yawn, stretched from wing to wing, and chirped, \"Morning, sunshine!\""],
       ko:["Pip이 하품해요. \"좋은 아침, 해님!\"","Pip이 하품하고 기지개를 켜요. \"좋은 아침, 해님!\"","Pip이 크게 하품하고 작은 날개를 쭉 펴요. \"좋은 아침, 해님!\"","Pip은 크게 하품하고 날개를 최대한 넓게 폈어요. \"좋은 아침, 해님!\" 하고 짹짹거렸죠.","Pip은 엄청 크게 하품하고 양 날개를 쭉 편 다음 \"좋은 아침, 햇살아!\" 하고 짹짹거렸어요."]},
      {emoji:"🪥",
       en:["Pip brushes his teeth. Brush, brush, brush!","Pip brushes his teeth. Up and down, brush, brush!","Pip goes to the bathroom and brushes his teeth until they sparkle.","Then he hopped into the bathroom and brushed his teeth until they were sparkling clean.","Next, he hopped to the bathroom and brushed his teeth until they were squeaky clean."],
       ko:["Pip이 이를 닦아요. 치카치카!","Pip이 이를 닦아요. 위아래로 치카치카!","Pip이 화장실에 가서 이가 반짝일 때까지 닦아요.","그다음 화장실로 콩콩 뛰어가 이가 반짝반짝해질 때까지 닦았어요.","다음엔 화장실로 콩콩 가서 이가 뽀드득할 때까지 닦았어요."]},
      {emoji:"🍌🥛",
       en:["Pip eats a banana. Pip drinks milk. Yum!","Pip eats a banana and drinks a glass of milk. Yum!","For breakfast, Pip eats a banana and drinks a big glass of milk.","For breakfast, he ate a ripe banana and drank a tall glass of cold milk.","Breakfast was a ripe banana and a tall glass of milk, which he gulped down in no time."],
       ko:["바나나를 먹고 우유를 마셔요. 냠!","바나나를 먹고 우유 한 잔을 마셔요. 냠!","아침으로 Pip은 바나나를 먹고 우유를 큰 잔으로 마셔요.","아침으로 잘 익은 바나나를 먹고 차가운 우유를 한 잔 가득 마셨어요.","아침은 잘 익은 바나나와 우유 한 잔. 순식간에 꿀꺽 다 먹었어요."]},
      {emoji:"👟",
       en:["Pip puts on his shoes. One, two!","Pip puts on his red shoes. One, two!","Pip puts on his red shoes and grabs his little yellow bag.","After that, he put on his favorite red shoes and grabbed his yellow backpack.","Then he slipped on his favorite red sneakers and slung his yellow backpack over his shoulder."],
       ko:["신발을 신어요. 하나, 둘!","빨간 신발을 신어요. 하나, 둘!","빨간 신발을 신고 작은 노란 가방을 챙겨요.","그다음 제일 좋아하는 빨간 신발을 신고 노란 가방을 챙겼어요.","그러고는 제일 좋아하는 빨간 운동화를 쓱 신고 노란 가방을 어깨에 둘러멨어요."]},
      {emoji:"👋🌈",
       en:["\"Bye-bye, Mommy! Have a great day!\"","\"Bye-bye, Mommy! See you later!\"","Pip waves at his mom. \"Bye-bye, Mommy! Have a great day!\"","\"Bye, Mom! I love you!\" Pip waved as he headed off to school.","\"Bye, Mom! Love you!\" Pip called out, waving as he skipped off to school."],
       ko:["\"엄마 안녕! 좋은 하루 보내요!\"","\"엄마 안녕! 이따 봐요!\"","Pip이 엄마에게 손을 흔들어요. \"엄마 안녕! 좋은 하루 보내요!\"","\"엄마 안녕! 사랑해요!\" Pip은 손을 흔들며 학교로 출발했어요.","\"엄마 안녕! 사랑해요!\" Pip은 외치고는 손을 흔들며 신나게 학교로 갔어요."]}
    ]

   1) Claude dictation (크롬·데스크톱 앱)  2) 브라우저 음성 인식(앱을 별도 주소로 배포했을 때)  3) 없음 → 버튼  */
const WebSR = window.SpeechRecognition || window.webkitSpeechRecognition;
function canListen(){ return !!claudeDict || !!WebSR; }
/* 반드시 클릭 핸들러에서 바로 호출 */
function listenOnce(onPartial, maxMs=6000){
  if(claudeDict){
    return new Promise(resolve=>{
      let text="", finished=false;
      const finish=()=>{ if(finished) return; finished=true; resolve(text.trim()||null); };
      try{
        claudeDict.onPartial(({text:t})=>{ onPartial&&onPartial((text+" "+t).trim()); });
        claudeDict.onFinal(({text:t})=>{ text+=" "+t; onPartial&&onPartial(text.trim()); });
        claudeDict.onState(({state})=>{ if(state==="idle") finish(); });
        claudeDict.start().catch(()=>finish());
        setTimeout(()=>{ claudeDict.stop().catch(()=>{}).finally(finish); }, maxMs);
      }catch(e){ finish(); }
    });
  }
  if(WebSR){
    return new Promise(resolve=>{
      let text="", done=false;
      try{
        const r=new WebSR(); r.lang="en-US"; r.interimResults=true; r.maxAlternatives=1;
        r.onresult=e=>{ let s=""; for(const res of e.results) s+=res[0].transcript; text=s; onPartial&&onPartial(s); };
        r.onend=()=>{ if(!done){done=true; resolve(text.trim()||null);} };
        r.onerror=()=>{ if(!done){done=true; resolve(text.trim()||null);} };
        r.start(); setTimeout(()=>{ try{r.stop();}catch(e){} }, maxMs);
      }catch(e){ resolve(null); }
    });
  }
  return Promise.resolve(null);
}
/* 아들용: 소리만 감지 (기기 안에서만 처리, 저장 없음). 마이크를 못 쓰면 null */
async function detectSound(ms=3500){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream); const an = ctx.createAnalyser(); an.fftSize=512; src.connect(an);
    const buf = new Uint8Array(an.fftSize); let heard=false; const t0=performance.now();
    await new Promise(res=>{ (function loop(){
      an.getByteTimeDomainData(buf); let sum=0; for(const v of buf){ const x=(v-128)/128; sum+=x*x; }
      if(Math.sqrt(sum/buf.length)>0.08) heard=true;
      if(heard || performance.now()-t0>ms) res(); else requestAnimationFrame(loop);
    })(); });
    stream.getTracks().forEach(t=>t.stop()); ctx.close();
    return heard;
  }catch(e){ return null; }
}

/* 말한 문장과 목표 문장 비교 → 0~1 */
function norm(s){ return (s||"").toLowerCase().replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim(); }
function matchScore(said, target){
  const a=norm(said).split(" ").filter(Boolean), b=norm(target).split(" ").filter(Boolean);
  if(!b.length) return 0; let hit=0; const pool=[...a];
  for(const w of b){ const i=pool.indexOf(w); if(i>=0){hit++; pool.splice(i,1);} }
  return hit/b.length;
}

  return `${topbar(name+"의 출퇴근 연습")}
    ${levelPicker(who)}
    <div class="notice">오늘 아이에게 써 볼 문장 3개예요. 출퇴근길에 <b>소리 내서 3번씩</b> 말해 보고, 집에서 실제로 아이에게 써 보세요. 그게 아이에게 가장 좋은 영어 듣기예요.</div>
    <h2 class="ko-title" style="font-size:20px;margin:16px 0 8px">⭐ 오늘의 문장</h2>
    <div class="list">${idx.map(i=>item(L[i],i,true)).join("")}</div>
    <h2 class="ko-title" style="font-size:20px;margin:20px 0 8px">이번 주 전체 문장</h2>
    <div class="list">${L.map((l,i)=>idx.includes(i)?'':item(l,i,false)).join("")}</div>`;
}
function bindParent(){
  const who=S.who||"dad"; const key="reps_"+who+"_L"+lv(who)+"_"+today(); const L=PL(who);
  const bump=i=>{ const r=store.get(key,{}); r[i]=Math.min(3,(r[i]||0)+1); store.set(key,r); if(r[i]===3){burst();} render(); };
  document.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>speak(L[+b.dataset.pl].en,{rate:+b.dataset.r}));
  document.querySelectorAll("[data-pd]").forEach(b=>b.onclick=()=>bump(+b.dataset.pd));
  document.querySelectorAll("[data-ps]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.ps, h=document.getElementById("ph"+i); h.textContent="듣고 있어요…";
    listenOnce(x=>{h.textContent="🎤 "+x;}).then(said=>{
      if(!said){ h.textContent="잘 못 들었어요. 한 번 더!"; return; }
      const sc=matchScore(said,L[i].en);
      if(sc>=0.6){ h.textContent=`🎤 "${said}" 좋아요! ✔`; setTimeout(()=>bump(i),700); }
      else h.textContent=`🎤 "${said}" — 🐢 천천히 듣기로 한 번 더 들어 보세요.`;
    });
  });
}

/* ===================== 화면: 부모 확인 ===================== */
function viewGate(){
  if(!S.q){ const a=12+Math.floor(Math.random()*8), b=6+Math.floor(Math.random()*4); S.q={a,b}; }
  return `${topbar("🔒 부모 확인")}
  <div class="card center"><p>보호자 확인을 위해 계산해 주세요.</p>
  <p class="en" style="font-size:34px">${S.q.a} × ${S.q.b} = ?</p>
  <input type="number" id="gateIn" inputmode="numeric" style="max-width:200px;text-align:center">
  <div style="margin-top:12px"><button class="btn primary" id="gateOk">확인</button></div>
  <div class="heard" id="gateMsg"></div></div>`;
}
function bindGate(){
  const ok=()=>{ const v=+document.getElementById("gateIn").value; if(v===S.q.a*S.q.b) go("dash"); else { document.getElementById("gateMsg").textContent="다시 계산해 주세요."; } };
  document.getElementById("gateOk").onclick=ok;
  document.getElementById("gateIn").onkeydown=e=>{ if(e.key==="Enter") ok(); };
}
function fmtMin(s){ return Math.round(s/60)+"분"; }
function viewDash(){
  const rows=[["family","👨‍👩‍👧‍👦 가족 시간"],["daughter","👧 딸 (혼자)"],["dad","👨 아빠"],["mom","👩 엄마"]].map(([k,n])=>`<tr><td>${n}</td><td>${fmtMin(usageSec(k))}</td><td>${fmtMin(weekUsageSec(k))}</td></tr>`).join("");
  const consent=store.get("consent",null);
  const W=WEEK, fl=lv('family'), dl=lv('daughter');
  return `${topbar("🔒 부모 확인")}
  <div class="card"><h2 class="ko-title" style="margin-top:0;font-size:20px">사용 시간</h2>
    <table><tr><th></th><th>오늘</th><th>최근 7일</th></tr>${rows}</table>
    <p class="muted">딸 혼자 사용은 하루 ${DAUGHTER_LIMIT_MIN}분으로 제한돼요. 기록은 이 기기에만 저장돼요.</p></div>
  <div class="card" style="margin-top:14px"><h2 class="ko-title" style="margin-top:0;font-size:20px">난이도</h2>
    <p class="muted" style="margin-top:0">사람마다 따로 정해요. 아들의 따라쟁이 단어는 단계와 상관없이 쉽게 유지돼요.</p>
    ${levelPicker('family')}${levelPicker('daughter')}${levelPicker('dad')}${levelPicker('mom')}
  </div>
  <div class="card" style="margin-top:14px"><h2 class="ko-title" style="margin-top:0;font-size:20px">이번 주 패키지 미리 보기 · ${esc(W.theme)}</h2>
    <p class="muted">지금 정한 난이도로 아이에게 나가는 문장이에요. 이상한 표현이 있으면 Claude에게 고쳐 달라고 해 주세요.</p>
    <details><summary>🎵 노래 · 가족 Lv${fl} (${songLines().length}줄)</summary><p class="en">${songLines().map(l=>esc(l.en)).join("<br>")}</p></details>
    <details><summary>🦜 따라쟁이 · 🤸 몸 반응 · 가족 Lv${fl}</summary><p class="en">${W.echo.map(l=>esc(l.en)).join(" · ")}<br>${W.moves.map(m=>esc(pick(m.en,fl))).join("<br>")}</p></details>
    <details><summary>🍳 역할극 · 가족 Lv${fl} (${W.roleplay.turns.length}턴)</summary><p>${W.roleplay.turns.map(t=>`<b>${esc(W.roleplay.roles[t.who])}</b>: <span class="en">${esc(pick(t.en,fl))}</span>`).join("<br>")}</p></details>
    <details><summary>🌙 이야기 · 가족 Lv${fl} (${W.story.pages.length}장)</summary><p class="en">${W.story.pages.map(p=>esc(pick(p.en,fl))).join("<br>")}</p></details>
    <details><summary>🎧 딸 섀도잉 · Lv${dl} (${W.shadowing[dl].length}문장)</summary><p class="en">${W.shadowing[dl].map(p=>esc(p.en)).join("<br>")}</p></details>
    <details><summary>💬 딸 대화 · Lv${dl} (${Object.keys(W.dialogue.nodes).length}장면)</summary><p class="en">${Object.keys(W.dialogue.nodes).map(k=>{const n=dnode(k,dl); return "🐥 "+esc(n.pip)+"<br>"+n.options.map(o=>"&nbsp;&nbsp;→ "+esc(o.en)).join("<br>");}).join("<br>")}</p></details>
    <details><summary>👨 아빠 문장 · Lv${lv('dad')}</summary><p class="en">${PL('dad').map(p=>esc(p.en)).join("<br>")}</p></details>
    <details><summary>👩 엄마 문장 · Lv${lv('mom')}</summary><p class="en">${PL('mom').map(p=>esc(p.en)).join("<br>")}</p></details>
  </div>
  <div class="card" style="margin-top:14px"><h2 class="ko-title" style="margin-top:0;font-size:20px">설정</h2>
    <p>말하기 속도 <b id="rateV">${settings.rate}</b></p>
    <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="${settings.rate}" style="width:100%">
    ${claudeTTS?`<p style="margin-top:14px">목소리</p><div class="row">
      <button class="btn ${settings.engine==='device'?'blue':'ghost'}" data-eng="device">기기 목소리</button>
      <button class="btn ${settings.engine==='claude'?'blue':'ghost'}" data-eng="claude">Claude 목소리</button></div>`:''}
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="testV">🔊 목소리 들어 보기</button></div>
    <p class="muted" style="margin-top:14px">음성 인식: ${canListen()?"사용 가능 ✔":"이 브라우저에서는 사용 불가 (버튼으로 진행)"}</p>
    <p class="muted">동의일: ${consent?new Date(consent.at).toLocaleString("ko-KR"):"-"}</p>
    <button class="btn ghost" id="revoke">동의 철회 및 기록 삭제</button>
  </div>
  <div class="modal" id="revokeModal" style="display:none"><div class="card center">
    <p>동의를 철회하면 이 기기의 사용 기록이 모두 지워지고 처음 화면으로 돌아가요.</p>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="rvNo">취소</button><button class="btn primary" id="rvYes">철회하기</button></div></div></div>`;
}
function bindDash(){
  const r=document.getElementById("rate");
  r.oninput=()=>{ settings.rate=+r.value; document.getElementById("rateV").textContent=settings.rate; store.set("settings",settings); };
  document.querySelectorAll("[data-eng]").forEach(b=>b.onclick=()=>{ settings.engine=b.dataset.eng; store.set("settings",settings); render(); });
  document.getElementById("testV").onclick=()=>speak("Good morning! I'm Pip. Let's have fun with English!");
  const m=document.getElementById("revokeModal");
  document.getElementById("revoke").onclick=()=>{ m.style.display="flex"; };
  document.getElementById("rvNo").onclick=()=>{ m.style.display="none"; };
  document.getElementById("rvYes").onclick=()=>{
    try{ Object.keys(localStorage).filter(k=>k.startsWith("fe_")).forEach(k=>localStorage.removeItem(k)); }catch(e){}
    memUsage={}; go("consent");
  };
}

/* ===================== 렌더 ===================== */
function render(){
  const s=S.screen; let html="";
  if(s!=="consent" && !store.get("consent",null) && !S.consentMem){ /* 저장소가 없으면 이번 방문만 */ }
  if(s==="consent") html=viewConsent();
  else if(s==="home") html=viewHome();
  else if(s==="family") html=viewFamily();
  else if(s==="daughter") html=viewDaughter();
  else if(s==="daughterLocked") html=viewDaughterLocked();
  else if(s==="parent") html=viewParent();
  else if(s==="gate") html=viewGate();
  else if(s==="dash") html=viewDash();
  $app.innerHTML=html;
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const to=b.dataset.go;
    if(to==="family"){ go("family",{stage:0,stageStart:Date.now(),echoIdx:0,roleIdx:0,storyIdx:0}); startTicking("family"); speak("Hello, everyone! I'm Pip. Let's sing!"); return; }
    if(to==="daughter"){
      if(usageSec("daughter")>=DAUGHTER_LIMIT_MIN*60){ go("daughterLocked"); return; }
      go("daughter",{tab:"shadow",shIdx:0}); startTicking("daughter"); return;
    }
    if(to==="parent"){ const who=b.dataset.who; go("parent",{who}); startTicking(who); return; }
    go(to);
  });
  bindLevelPickers();
  if(s==="consent") bindConsent();
  if(s==="family") bindFamily();
  if(s==="daughter") bindDaughter();
  if(s==="parent") bindParent();
  if(s==="gate") bindGate();
  if(s==="dash") bindDash();
}
/* 저장소가 막힌 환경에서도 동의 후 진행되도록 */
const _origSet = store.set; store.set = function(k,v){ _origSet(k,v); if(k==="consent") S.consentMem=v; };
const _origGet = store.get; store.get = function(k,d){ const v=_origGet(k,d); if(k==="consent" && v==null && S && S.consentMem) return S.consentMem; return v; };
render();
/* 홈 화면 설치·오프라인 지원 (독립 주소로 배포했을 때만 동작) */
try{ if("serviceWorker" in navigator && location.protocol==="https:" && !/claude\.ai|claudeusercontent/.test(location.host)){ navigator.serviceWorker.register("sw.js").catch(()=>{}); } }catch(e){}
</script>
</body>
